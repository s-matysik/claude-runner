[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-runner"
version = "0.1.0"
description = "Small, dependency-free wrapper around `claude -p` with failure classification, retry, cost cap and timing report."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sebastian Matysik" }]
keywords = ["claude", "claude-code", "cli", "wrapper", "retry"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]

[project.scripts]
claude-runner-report = "claude_runner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
